<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-hidden="true">
  <style>
    .bg { fill: color-mix(in srgb, var(--c-accent, #00a1d6) 14%, #f3f5f7); }
    .accent { fill: var(--c-accent, #00a1d6); }
    .accent-soft { fill: color-mix(in srgb, var(--c-accent, #00a1d6) 35%, #ffffff); }
    .ink { fill: #1f2329; }
    .screen { fill: #111827; }
    .muted { fill: color-mix(in srgb, var(--c-accent, #00a1d6) 22%, #dbe4ea); }
  </style>
  <ellipse class="bg" cx="100" cy="168" rx="62" ry="14"/>
  <circle class="muted" cx="42" cy="48" r="8" opacity=".7"/>
  <circle class="accent-soft" cx="168" cy="56" r="10" opacity=".8"/>
  <path class="accent" d="M34 72l10-16 10 16z" opacity=".55"/>
  <rect class="muted" x="156" y="110" width="14" height="14" rx="3" transform="rotate(20 163 117)" opacity=".55"/>
  <!-- TV body -->
  <rect class="accent-soft" x="48" y="52" width="104" height="86" rx="16"/>
  <rect class="accent" x="52" y="56" width="96" height="78" rx="13"/>
  <rect class="screen" x="62" y="66" width="76" height="50" rx="8"/>
  <!-- antennas -->
  <circle class="ink" cx="78" cy="46" r="4"/>
  <circle class="ink" cx="122" cy="46" r="4"/>
  <path d="M78 46c8-18 36-18 44 0" stroke="#1f2329" stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- stand -->
  <rect class="accent" x="88" y="138" width="24" height="8" rx="3"/>
  <rect class="accent-soft" x="78" y="146" width="44" height="8" rx="4"/>
  <!-- leaves -->
  <path class="muted" d="M28 148c18-4 28 10 24 22-16 2-28-8-24-22z" opacity=".85"/>
  <path class="accent-soft" d="M172 148c-18-4-28 10-24 22 16 2 28-8 24-22z" opacity=".9"/>
</svg>
